# Supabase 무료 프로젝트는 7일 동안 활동이 없으면 자동 정지된다. 3일마다 keepalive() RPC를 한 번 호출한다.
# (공개 저장소라 Actions가 무료. 저장소에 60일간 활동이 없으면 GitHub가 예약 작업을 끄므로 릴리스 때 함께 확인)
name: keepalive

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: call keepalive()
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          code=$(curl -s -o body.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "status $code body $(cat body.txt)"
          test "$code" = "200"
